<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Ая, AI-наставник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 24px;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.04);
      padding: 40px 32px;
      text-align: center;
    }

    .login-card .icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #c9a87c, #b8956a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
    }

    .login-card h1 {
      font-size: 20px;
      font-weight: 600;
      color: #2c2420;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      font-size: 13px;
      color: #9b8e82;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 14px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #8b7e72;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      border: 1.5px solid #e8ddd0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      color: #2c2420;
    }

    .field input::placeholder { color: #c4b8aa; }
    .field input:focus { border-color: #c9a87c; }

    .password-wrap {
      position: relative;
    }

    .password-wrap input { padding-right: 44px; }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #b5a898;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .toggle-pw:hover { color: #8b7e72; }

    .error-msg {
      color: #d4604a;
      font-size: 13px;
      margin-bottom: 14px;
      min-height: 20px;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #c9a87c, #b8956a);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .login-btn:hover { transform: scale(1.02); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .branding {
      margin-top: 24px;
      font-size: 11px;
      color: #b5a898;
    }

    .branding a {
      color: #b8956a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="icon">✨</div>
    <h1>Ая — AI-наставник</h1>
    <p class="subtitle">Курс «Аутентичный руководитель»</p>

    <form id="loginForm">
      <div class="field">
        <label>Логин</label>
        <input type="text" id="login" placeholder="Введите логин" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" title="Показать пароль">👁</button>
        </div>
      </div>
      <div class="error-msg" id="error"></div>
      <button type="submit" class="login-btn" id="submitBtn">Войти</button>
    </form>

    <div class="branding">
      <a href="https://yanachufistova.ru/sale" target="_blank">Школа женского управления</a> · Яна Чуфистова
    </div>
  </div>

  <script>
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('togglePw');
      const visible = pw.type === 'text';
      pw.type = visible ? 'password' : 'text';
      btn.textContent = visible ? '👁' : '🙈';
      btn.title = visible ? 'Показать пароль' : 'Скрыть пароль';
    });

    if (localStorage.getItem('aya_token')) {
      window.location.href = '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: document.getElementById('login').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (data.ok && data.token) {
          localStorage.setItem('aya_token', data.token);
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'Ошибка входа';
        }
      } catch {
        errorEl.textContent = 'Ошибка соединения';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
